# Optional: keeps the Uptime metric fresh in production by pinging the app's
# uptime endpoint on a schedule (Next.js 16 has no built-in cron).
#
# Setup:
#   1. Deploy the portfolio so /api/cron/uptime is publicly reachable.
#   2. Add two repository secrets (Settings → Secrets and variables → Actions):
#        SITE_URL     e.g. https://your-portfolio.vercel.app
#        CRON_SECRET  the same value as CRON_SECRET in your deployment env
#
# Without this workflow, uptime is still sampled on every dashboard load
# (throttled to ~15 min) — this just adds regular samples when there's no traffic.
# If you don't want scheduled runs, delete this file.

name: Uptime check

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger uptime check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Add SITE_URL + CRON_SECRET repo secrets to enable."
            exit 0
          fi
          curl -fsS -X GET "$SITE_URL/api/cron/uptime" \
            -H "Authorization: Bearer $CRON_SECRET"
